name: Build WPE WebKit Browser Plugin

on:
  push:
    paths:
      - 'wpewebkit-browser-src/**'
      - 'wpewebkit-browser/**'
      - '.github/workflows/build-wpe.yml'
  workflow_dispatch:

env:
  GCC_BASE_URL: https://github.com/Redbeanw44602/aarch64-linux-gnu-gcc-6.5.0/releases/download/6.5.0
  INSTALL_PREFIX: /opt/wpe-install

jobs:
  # ==========================================================
  # 交叉编译 WPE 依赖 (libsoup / libwpe / wpebackend-fdo)
  # ==========================================================
  build-deps:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: 安装工具链和构建依赖
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel git wget curl cmake meson ninja python3 python-pip \
            pkgconf glib2 glib2-docs libxml2 sqlite3 libpsl \
            libxkbcommon libxkbcommon-x11 libxcb xcb-util-keysyms wayland-protocols

          # 安装 GCC 6.5.0 交叉工具链 (glibc 2.27)
          cd /tmp
          wget -q "${{ env.GCC_BASE_URL }}/aarch64-linux-gnu-binutils-2.30-1-x86_64.pkg.tar.zst"
          wget -q "${{ env.GCC_BASE_URL }}/aarch64-linux-gnu-glibc-2.27-1-any.pkg.tar.zst"
          wget -q "${{ env.GCC_BASE_URL }}/aarch64-linux-gnu-gcc-6.5.0-1-x86_64.pkg.tar.zst"
          pacman -U --noconfirm \
            aarch64-linux-gnu-binutils-2.30-1-x86_64.pkg.tar.zst \
            aarch64-linux-gnu-glibc-2.27-1-any.pkg.tar.zst \
            aarch64-linux-gnu-gcc-6.5.0-1-x86_64.pkg.tar.zst
          aarch64-linux-gnu-gcc --version

      - uses: actions/checkout@v4

      - name: 创建 meson cross file
        run: |
          mkdir -p $INSTALL_PREFIX/lib/pkgconfig

          # pkg-config 包装脚本：去掉 -L/usr/lib，替换为我们的 arm64 路径
          cat > /tmp/pkg-config-wrap.sh <<SCRIPT
          #!/bin/bash
          exec /usr/bin/pkg-config "\$@" | sed 's| -L/usr/lib | -L$INSTALL_PREFIX/lib |g'
          SCRIPT
          chmod +x /tmp/pkg-config-wrap.sh

          cat > /tmp/cross-aarch64.txt <<EOF
          [binaries]
          c = '/usr/bin/aarch64-linux-gnu-gcc'
          cpp = '/usr/bin/aarch64-linux-gnu-g++'
          ar = '/usr/bin/aarch64-linux-gnu-ar'
          strip = '/usr/bin/aarch64-linux-gnu-strip'
          pkgconfig = '/tmp/pkg-config-wrap.sh'
          glib_mkenums = '/usr/bin/glib-mkenums'
          glib_compile_resources = '/usr/bin/glib-compile-resources'
          gdbus_codegen = '/usr/bin/gdbus-codegen'

          [properties]
          pkg_config_libdir = '$INSTALL_PREFIX/lib/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/lib/pkgconfig'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [built-in options]
          c_link_args = ['-L$INSTALL_PREFIX/lib', '-L/usr/aarch64-linux-gnu/lib']
          cpp_link_args = ['-L$INSTALL_PREFIX/lib', '-L/usr/aarch64-linux-gnu/lib']
          EOF

      # ---------- libsoup2 (直接 wget 下载 arm64 deb，不依赖 apt-get) ----------
      - name: 下载 libsoup2
        run: |
          pacman -S --noconfirm dpkg wget ca-certificates
          mkdir -p $INSTALL_PREFIX/lib/pkgconfig $INSTALL_PREFIX/lib $INSTALL_PREFIX/include

          cd /tmp
          BASE="http://ports.ubuntu.com/pool/main/libs/libsoup2.4"

          # 尝试多个已知版本
          for ver in 2.74.3-1 2.74.2-1 2.74.2-3 2.74.0-2; do
            wget -q "$BASE/libsoup2.4-1_${ver}_arm64.deb" && break
          done
          for ver in 2.74.3-1 2.74.2-1 2.74.2-3 2.74.0-2; do
            wget -q "$BASE/libsoup2.4-dev_${ver}_arm64.deb" && break
          done

          mkdir -p /tmp/soup-root
          for deb in *.deb; do dpkg-deb -x "$deb" /tmp/soup-root 2>/dev/null || true; done

          cp /tmp/soup-root/usr/lib/aarch64-linux-gnu/libsoup-2.4.so* $INSTALL_PREFIX/lib/ 2>/dev/null || true
          cp -r /tmp/soup-root/usr/include/libsoup-2.4 $INSTALL_PREFIX/include/ 2>/dev/null || true
          cp /tmp/soup-root/usr/lib/aarch64-linux-gnu/pkgconfig/libsoup-2.4.pc $INSTALL_PREFIX/lib/pkgconfig/ 2>/dev/null || true
          [ -f "$INSTALL_PREFIX/lib/pkgconfig/libsoup-2.4.pc" ] && \
            sed -i "s|prefix=/usr|prefix=$INSTALL_PREFIX|g" "$INSTALL_PREFIX/lib/pkgconfig/libsoup-2.4.pc"

          ls $INSTALL_PREFIX/lib/libsoup* || echo "WARNING: libsoup .so not found, but continuing"

      # ---------- EGL/GLES 头文件 + wpebackend-fdo (预编译 arm64 deb，必须在 libwpe 前) ----------
      - name: 下载 EGL/GLES 头文件 + wpebackend-fdo
        run: |
          mkdir -p $INSTALL_PREFIX/lib/pkgconfig $INSTALL_PREFIX/lib $INSTALL_PREFIX/include
          cd /tmp

          # EGL/GLES/xkbcommon 头文件从 Archlinux 系统包获取
          pacman -S --noconfirm libglvnd

          SYSROOT="/usr/aarch64-linux-gnu"
          sudo mkdir -p "$SYSROOT/include"

          # 复制系统头文件到 sysroot
          sudo cp -r /usr/include/xkbcommon "$SYSROOT/include/" 2>/dev/null || true
          sudo cp -r /usr/include/EGL $SYSROOT/include/ 2>/dev/null || true
          sudo cp -r /usr/include/GLES2 $SYSROOT/include/ 2>/dev/null || true
          sudo cp -r /usr/include/GLES3 $SYSROOT/include/ 2>/dev/null || true
          sudo cp -r /usr/include/KHR $SYSROOT/include/ 2>/dev/null || true

          # 创建 sysroot 下的 pkg-config .pc 文件
          sudo mkdir -p "$SYSROOT/lib/pkgconfig"
          cat > /tmp/egl.pc <<PCEOF
          prefix=/usr/aarch64-linux-gnu
          includedir=\${prefix}/include
          Name: egl
          Description: EGL
          Version: 1.5
          Cflags: -I\${includedir}
          PCEOF
          sudo cp /tmp/egl.pc "$SYSROOT/lib/pkgconfig/egl.pc"
          cat > /tmp/glesv2.pc <<PCEOF
          prefix=/usr/aarch64-linux-gnu
          includedir=\${prefix}/include
          Name: glesv2
          Description: OpenGL ES 2.0
          Version: 2.0
          Cflags: -I\${includedir}
          PCEOF
          sudo cp /tmp/glesv2.pc "$SYSROOT/lib/pkgconfig/glesv2.pc"

          # 同时创建 $INSTALL_PREFIX 下的头文件和 pkg-config
          mkdir -p $INSTALL_PREFIX/include $INSTALL_PREFIX/lib/pkgconfig
          cp -r /usr/include/EGL $INSTALL_PREFIX/include/ 2>/dev/null || true
          cp -r /usr/include/GLES2 $INSTALL_PREFIX/include/ 2>/dev/null || true
          cp -r /usr/include/GLES3 $INSTALL_PREFIX/include/ 2>/dev/null || true
          cp -r /usr/include/KHR $INSTALL_PREFIX/include/ 2>/dev/null || true
          cp -r /usr/include/xkbcommon $INSTALL_PREFIX/include/ 2>/dev/null || true
          cp /tmp/egl.pc $INSTALL_PREFIX/lib/pkgconfig/ 2>/dev/null || true
          cp /tmp/glesv2.pc $INSTALL_PREFIX/lib/pkgconfig/ 2>/dev/null || true

          # 同时下载 arm64 libxkbcommon（libwpe 链接时需要）
          XKB="http://ports.ubuntu.com/pool/main/libx/libxkbcommon"
          for ver in 1.4.0-1 1.4.1-1 1.3.0-1 1.2.1-1 1.0.5-1; do
            wget -q "$XKB/libxkbcommon0_${ver}_arm64.deb" && break || true
          done
          for ver in 1.4.1-1 1.4.0-1; do
            wget -q "$XKB/libxkbcommon-dev_${ver}_arm64.deb" && break || true
          done

          # 下载 wpebackend-fdo arm64 deb
          WPEBE="http://ports.ubuntu.com/pool/universe/w/wpebackend-fdo"
          for ver in 1.14.0-1 1.14.3-1 1.12.0-1 1.10.0-1; do
            wget -q "$WPEBE/libwpebackend-fdo-1.0-1_${ver}_arm64.deb" && break || true
          done
          for ver in 1.14.0-1 1.14.3-1 1.12.0-1 1.10.0-1; do
            wget -q "$WPEBE/libwpebackend-fdo-1.0-dev_${ver}_arm64.deb" && break || true
          done

          for deb in *.deb; do
            dpkg-deb -x "$deb" /tmp/extract 2>/dev/null || true
          done

          # 拷贝 arm64 .so（wpebackend-fdo, libxkbcommon 等所有 arm64 库）
          cp /tmp/extract/usr/lib/aarch64-linux-gnu/*.so* $INSTALL_PREFIX/lib/ 2>/dev/null || true
          # 显式处理 libxkbcommon：如果 deb 里有，强制拷贝并修正 pkg-config
          if [ -f "/tmp/extract/usr/lib/aarch64-linux-gnu/libxkbcommon.so" ]; then
            cp /tmp/extract/usr/lib/aarch64-linux-gnu/libxkbcommon.so* $INSTALL_PREFIX/lib/
            cp -r /tmp/extract/usr/include/xkbcommon $INSTALL_PREFIX/include/
            cp /tmp/extract/usr/lib/aarch64-linux-gnu/pkgconfig/xkbcommon.pc $INSTALL_PREFIX/lib/pkgconfig/ 2>/dev/null || true
          fi
          cp -r /tmp/extract/usr/include/wpe-fdo-1.0 $INSTALL_PREFIX/include/ 2>/dev/null || true
          cp /tmp/extract/usr/lib/aarch64-linux-gnu/pkgconfig/*.pc $INSTALL_PREFIX/lib/pkgconfig/ 2>/dev/null || true

          for pc in $INSTALL_PREFIX/lib/pkgconfig/*.pc; do
            [ -f "$pc" ] && sed -i "s|prefix=/usr|prefix=$INSTALL_PREFIX|g" "$pc"
          done

          echo "=== EGL headers ===" && ls $INSTALL_PREFIX/include/EGL/ 2>/dev/null || echo "MISSING"
          echo "=== WPEBackend ===" && ls $INSTALL_PREFIX/lib/libWPEBackend* 2>/dev/null || echo "MISSING"

      # ---------- libwpe ----------
      - name: 编译 libwpe
        run: |
          cd /tmp
          wget -q https://github.com/WebPlatformForEmbedded/libwpe/archive/refs/tags/1.16.0.tar.gz -O libwpe.tar.gz
          tar xf libwpe.tar.gz && cd libwpe-1.16.0
          meson setup _build . \
            --cross-file /tmp/cross-aarch64.txt \
            --prefix=$INSTALL_PREFIX --buildtype=release
          ninja -C _build -j$(nproc)
          ninja -C _build install

      - name: 上传依赖产物
        uses: actions/upload-artifact@v4
        with:
          name: wpe-deps-aarch64
          path: ${{ env.INSTALL_PREFIX }}
          retention-days: 7

  # ==========================================================
  # 交叉编译浏览器插件 .so（遵循 build.yaml 的 xmake + zig 模式）
  # ==========================================================
  build-plugin:
    needs: build-deps
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      QT_DIR: /opt/qt-aarch64
      XMAKE_ROOT: y
    steps:
      - name: 安装工具链 + xmake + zig
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel git wget xmake zig

          cd /tmp
          wget -q "${{ env.GCC_BASE_URL }}/aarch64-linux-gnu-binutils-2.30-1-x86_64.pkg.tar.zst"
          wget -q "${{ env.GCC_BASE_URL }}/aarch64-linux-gnu-glibc-2.27-1-any.pkg.tar.zst"
          wget -q "${{ env.GCC_BASE_URL }}/aarch64-linux-gnu-gcc-6.5.0-1-x86_64.pkg.tar.zst"
          pacman -U --noconfirm \
            aarch64-linux-gnu-binutils-2.30-1-x86_64.pkg.tar.zst \
            aarch64-linux-gnu-glibc-2.27-1-any.pkg.tar.zst \
            aarch64-linux-gnu-gcc-6.5.0-1-x86_64.pkg.tar.zst

      - uses: actions/checkout@v4

      - name: 下载 WPE 依赖产物
        uses: actions/download-artifact@v4
        with:
          name: wpe-deps-aarch64
          path: ${{ env.INSTALL_PREFIX }}

      - name: 下载预编译 ARM64 Qt 5.15.2
        run: |
          wget -q \
            https://github.com/Redbeanw44602/aarch64-linux-qt-5.15.2/releases/latest/download/aarch64-linux-qt-5.15.2.tar.gz \
            -O /tmp/qt.tar.gz
          mkdir -p $QT_DIR
          tar -xzf /tmp/qt.tar.gz -C $QT_DIR

      - name: 构建 fake qmake
        run: |
          g++ -fmax-errors=1 \
            -o "$QT_DIR/bin/qmake" \
            -D"PREFIX=\"$QT_DIR\"" \
            "$QT_DIR/bin/qmake.cpp"
          $QT_DIR/bin/qmake

      - name: 交叉编译插件 .so
        run: |
          cd wpewebkit-browser-src

          # 设置 WPE 库路径供 xmake 发现
          export PKG_CONFIG_PATH="$INSTALL_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"

          xmake f \
            --qt="$QT_DIR" \
            --arch=arm64-v8a \
            --toolchain=zig \
            --cross=aarch64-linux-gnu.2.27 \
            -m release \
            -c \
            -y

          xmake build -j$(nproc)

          mkdir -p /tmp/out
          cp build/linux/arm64-v8a/release/libwpewebkit_browser.so /tmp/out/ 2>/dev/null || \
            cp build/*/release/libwpewebkit_browser.so /tmp/out/ 2>/dev/null || \
            echo "WARNING: .so not found, build may have failed"

      - name: 打包插件
        run: |
          mkdir -p /tmp/release/wpewebkit-browser /tmp/release/wpe-libs
          cp -r wpewebkit-browser/*.qml wpewebkit-browser/metadata.json /tmp/release/wpewebkit-browser/
          cp /tmp/out/libwpewebkit_browser.so /tmp/release/wpewebkit-browser/
          cp $INSTALL_PREFIX/lib/*.so* /tmp/release/wpe-libs/ 2>/dev/null || true

      - name: 上传最终产物
        uses: actions/upload-artifact@v4
        with:
          name: wpewebkit-browser-release
          path: /tmp/release/
          retention-days: 30

      - name: 上传单独 .so
        uses: actions/upload-artifact@v4
        with:
          name: libwpewebkit_browser.so
          path: /tmp/out/
          retention-days: 30
